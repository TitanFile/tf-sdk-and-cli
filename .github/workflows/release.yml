name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            asset_name: titanfile-macos-arm64
          - os: macos-13
            asset_name: titanfile-macos-x64
          - os: ubuntu-latest
            asset_name: titanfile-linux-x64
          - os: windows-latest
            asset_name: titanfile-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: titanfile-sdk
        run: |
          pip install pyinstaller
          pip install -e .

      - name: Build binary
        working-directory: titanfile-sdk
        run: python -m PyInstaller titanfile.spec --noconfirm

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        working-directory: titanfile-sdk
        run: mv dist/titanfile dist/${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        working-directory: titanfile-sdk
        run: mv dist/titanfile.exe dist/${{ matrix.asset_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: titanfile-sdk/dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
